# Troop 900 Tree Lot production topology on Render.
# Lowest-cost paid plans that support pre-deploy migrations and PostgreSQL PITR.
# Confirm live pricing before creating billable resources.
#
# Image digests are promoted by the Release workflow; the Blueprint pins the
# repository image URL and private GHCR credential name only.

services:
  - type: web
    name: treelot-web
    runtime: image
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 30
    preDeployCommand: /app/migrate up
    domains:
      - treelot.troop900livermore.org
    image:
      url: ghcr.io/bennettsmith/t900treelot:latest
      creds:
        fromRegistryCreds:
          name: ghcr-treelot
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://treelot.troop900livermore.org
      - key: TREE_LOT_TIME_ZONE
        value: America/Los_Angeles
      - key: WEBAUTHN_RP_ID
        value: treelot.troop900livermore.org
      - key: GROUPS_IO_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: treelot-db
          property: connectionString
      - key: SESSION_KEY
        sync: false
      - key: BOOTSTRAP_ENROLLMENT_TOKEN
        sync: false
      - key: BOOTSTRAP_TOKEN_EXPIRES_AT
        sync: false

  - type: worker
    name: treelot-worker
    runtime: image
    plan: starter
    region: oregon
    dockerCommand: /app/worker
    image:
      url: ghcr.io/bennettsmith/t900treelot:latest
      creds:
        fromRegistryCreds:
          name: ghcr-treelot
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://treelot.troop900livermore.org
      - key: TREE_LOT_TIME_ZONE
        value: America/Los_Angeles
      - key: WEBAUTHN_RP_ID
        value: treelot.troop900livermore.org
      - key: GROUPS_IO_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: treelot-db
          property: connectionString
      - key: SESSION_KEY
        sync: false
      - key: BOOTSTRAP_ENROLLMENT_TOKEN
        sync: false
      - key: BOOTSTRAP_TOKEN_EXPIRES_AT
        sync: false

databases:
  - name: treelot-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    # Minimum paid storage; increase only when measured need appears.
    diskSizeGB: 1
